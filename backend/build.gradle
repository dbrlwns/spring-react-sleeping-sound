plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Authenticated educational content library with automatic TTS narration'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot가 제공하는 BOM으로 각 Spring 라이브러리의 호환 버전을 맞춘다.
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Google Cloud BOM이 Text-to-Speech와 그 하위 SDK들의 호환 버전을 함께 관리한다.
    implementation platform('com.google.cloud:libraries-bom:26.86.0')
    implementation 'com.google.cloud:google-cloud-texttospeech'
    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
