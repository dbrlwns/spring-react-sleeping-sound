spring:
  application:
    name: sleep-knowledge-api
  datasource:
    # 학습용 로컬 DB입니다. 서버를 재시작해도 작성한 콘텐츠가 backend/data에 남습니다.
    url: jdbc:h2:file:./data/sleepknowledge;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  # 세션 인증을 사용하지만 운영용 권한·사용량 제한은 없으므로 기본값은 이 Mac 안에서만 접근합니다.
  address: 127.0.0.1
  port: 8080

app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
  narration:
    # google-chirp3로 바꿀 때만 Google SDK가 ADC를 조회하고 원격 클라이언트를 생성합니다.
    provider: macos-say
    macos-say:
      command: /usr/bin/say
      base-words-per-minute: 180
      timeout: 5m
    google-chirp3:
      endpoint: texttospeech.googleapis.com:443
      language-code: ko-KR
      voice-name: ko-KR-Chirp3-HD-Kore
      max-input-bytes: 5000
      max-chunks: 32
      max-audio-bytes: 268435456
      rpc-timeout: 30s
