spring:
  application:
    name: sleep-knowledge-api
  datasource:
    # 학습용 로컬 DB입니다. 서버를 재시작해도 작성한 콘텐츠가 backend/data에 남습니다.
    url: jdbc:h2:file:./data/sleepknowledge;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  # 세션 인증을 사용하지만 운영용 권한·사용량 제한은 없으므로 기본값은 개발 머신 안에서만 접근합니다.
  address: 127.0.0.1
  port: 8080

app:
  security:
    # 기존 가입 계정을 관리자 권한으로 승격합니다. 예: APP_SECURITY_ADMIN_USERNAMES=alice
    admin-usernames: ["dbrlwns1"]
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
  narration:
    # Google SDK는 Application Default Credentials(ADC)로 원격 클라이언트를 생성합니다.
    google-chirp3:
      endpoint: texttospeech.googleapis.com:443
      max-input-bytes: 5000
      max-chunks: 32
      # PCM16 mono 24 kHz 기준 약 46분 분량이며, 30분 목표에 여유를 둔 메모리 상한입니다.
      max-audio-bytes: 134217728
      # 청크 하나의 최대 대기 시간입니다. 완성 음성의 길이를 정하는 값은 아닙니다.
      rpc-timeout: 30m
    # Google이 반환한 LINEAR16 WAV 청크를 합친 뒤, 저장 직전에 하나의 MP3로 인코딩합니다.
    ffmpeg:
      command: ffmpeg
      timeout: 5m
      max-output-bytes: 67108864
      bitrate-kbps: 64
